controller_manager:
  ros__parameters:
    update_rate: 100 

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    # Closed loop, position-based. Used by MoveIt and normal joystick teleop.
    # Needs working encoders.
    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    # The two fingers (one shared motor). Separate from the arm so MoveIt and the
    # joystick can command them independently.
    gripper_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    # Joystick sends joint VELOCITIES straight to the hardware -- no position
    # loop. Use this when encoders are unreliable/disconnected (together with
    # open_loop_joints:=...). Spawned INACTIVE; real_arm_teleop_node switches
    # between this and arm_controller (only one can own the joints at a time).
    joystick_only_controller:
      type: velocity_controllers/JointGroupVelocityController

joystick_only_controller:
  ros__parameters:
    # Order matters: real_arm_teleop_node publishes commands in this order.
    joints:
      - base_link_joint
      - shoulder_link_joint
      - elbow_link_joint
      - wrist_link_joint
      - palm_link_joint
      - left_finger_link_joint
      - right_finger_link_joint

arm_controller:
  ros__parameters:
    joints:
      - base_link_joint
      - shoulder_link_joint
      - elbow_link_joint
      - wrist_link_joint
      - palm_link_joint
    command_interfaces:
      - velocity
    state_interfaces:
      - position
      - velocity

    interpolation_method: splines
    allow_partial_joints_goal: true


    # ff_velocity_scale 1.0: send the trajectory's own velocity, so the PID only corrects
    # the remaining error. At the default 0.0 the joint must fall behind to move at all
    # (0.5 rad/s needs 0.1 rad of error at p=5), and fast moves hit the path tolerance.
    gains:
      base_link_joint:            {p: 5.0, i: 0.0, d: 0.1, i_clamp: 1.0, ff_velocity_scale: 1.0}
      shoulder_link_joint:        {p: 5.0, i: 0.0, d: 0.1, i_clamp: 1.0, ff_velocity_scale: 1.0}
      elbow_link_joint:           {p: 5.0, i: 0.0, d: 0.1, i_clamp: 1.0, ff_velocity_scale: 1.0}
      wrist_link_joint:           {p: 5.0, i: 0.0, d: 0.1, i_clamp: 1.0, ff_velocity_scale: 1.0}
      palm_link_joint:            {p: 5.0, i: 0.0, d: 0.1, i_clamp: 1.0, ff_velocity_scale: 1.0}
   
# Required since command_interfaces is velocity-only: without gains, JTC
# has no way to convert a position-trajectory error into a velocity
# command. These are starting-point placeholders, not tuned values --
# tune them the same way you'll tune RoverArmHardware's own kp/ki, ideally
# with the arm unloaded first. A joint that oscillates needs lower p; one
# that lags behind the trajectory needs higher p or some i.

    # Tolerances. If a joint falls more than `trajectory` behind the commanded
    # trajectory (e.g. encoders dropped out and its motor was stopped), JTC
    # aborts the trajectory and holds the CURRENT position instead of lurching
    # toward the old target when the joint can move again. Looser than final
    # values on purpose while the gains are untuned -- tighten after tuning.
    constraints:
      goal_time: 2.0                  # s allowed after the trajectory end to reach the goal
      stopped_velocity_tolerance: 0.1 # rad/s to consider the arm stopped at the goal
      base_link_joint:         {trajectory: 0.25, goal: 0.05}
      shoulder_link_joint:     {trajectory: 0.25, goal: 0.05}
      elbow_link_joint:        {trajectory: 0.25, goal: 0.05}
      wrist_link_joint:        {trajectory: 0.25, goal: 0.05}
      palm_link_joint:         {trajectory: 0.25, goal: 0.05}

gripper_controller:
  ros__parameters:
    joints:
      - left_finger_link_joint
      - right_finger_link_joint
    command_interfaces:
      - velocity
    state_interfaces:
      - position
      - velocity
    interpolation_method: splines
    gains:
      left_finger_link_joint:  {p: 5.0, i: 0.0, d: 0.0, i_clamp: 1.0, ff_velocity_scale: 1.0}
      right_finger_link_joint: {p: 5.0, i: 0.0, d: 0.0, i_clamp: 1.0, ff_velocity_scale: 1.0}
    # No tolerances on purpose: when the fingers close on an object they stop short
    # of the target. With tolerances JTC would give up and hold that position with
    # ~zero force; without them it keeps squeezing toward the target, with the force
    # capped by RoverArmHardware's gripper_pwm_limit.
