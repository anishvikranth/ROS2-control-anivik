controller_manager:
  ros__parameters:
    update_rate: 100 

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    # Closed loop, position-based. Used by MoveIt and normal joystick teleop.
    # Needs working encoders.
    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    # Joystick sends joint VELOCITIES straight to the hardware -- no position
    # loop. Use this when encoders are unreliable/disconnected (together with
    # open_loop_joints:=...). Spawned INACTIVE; real_arm_teleop_node switches
    # between this and arm_controller (only one can own the joints at a time).
    joystick_only_controller:
      type: velocity_controllers/JointGroupVelocityController

joystick_only_controller:
  ros__parameters:
    # Order matters: real_arm_teleop_node publishes commands in this order.
    joints:
      - base_link_joint
      - shoulder_link_joint
      - elbow_link_joint
      - wrist_link_joint
      - palm_link_joint
      - left_finger_link_joint
      - right_finger_link_joint

arm_controller:
  ros__parameters:
    joints:
      - base_link_joint
      - shoulder_link_joint
      - elbow_link_joint
      - wrist_link_joint
      - palm_link_joint
      - left_finger_link_joint
      - right_finger_link_joint
    command_interfaces:
      - velocity
    state_interfaces:
      - position
      - velocity

    interpolation_method: splines
    allow_partial_joints_goal: true


    gains:
      base_link_joint:            {p: 5.0, i: 0.0, d: 0.1, i_clamp: 1.0}
      shoulder_link_joint:        {p: 5.0, i: 0.0, d: 0.1, i_clamp: 1.0}
      elbow_link_joint:           {p: 5.0, i: 0.0, d: 0.1, i_clamp: 1.0}
      wrist_link_joint:           {p: 5.0, i: 0.0, d: 0.1, i_clamp: 1.0}
      palm_link_joint:            {p: 5.0, i: 0.0, d: 0.1, i_clamp: 1.0}
      left_finger_link_joint:     {p: 5.0, i: 0.0, d: 0.1, i_clamp: 1.0}
      right_finger_link_joint:    {p: 5.0, i: 0.0, d: 0.1, i_clamp: 1.0}
   
# Required since command_interfaces is velocity-only: without gains, JTC
# has no way to convert a position-trajectory error into a velocity
# command. These are starting-point placeholders, not tuned values --
# tune them the same way you'll tune RoverArmHardware's own kp/ki, ideally
# with the arm unloaded first. A joint that oscillates needs lower p; one
# that lags behind the trajectory needs higher p or some i.
# constraints:
#       goal_time: 0.6 # seconds allowed to reach the final goal
#       stopped_velocity_tolerance: 0.05 # rad/s to consider the arm "stopped"
      
#       base_link_joint:
#         trajectory: 0.1 # max allowed tracking error (in radians) during motion
#         goal: 0.02       # max allowed error at final destination
#       shoulder_link_joint:
#         trajectory: 0.1
#         goal: 0.02
#       elbow_link_joint:
#         trajectory: 0.1
#         goal: 0.02
#       wrist_link_joint:
#         trajectory: 0.1
#         goal: 0.02
#       palm_link_joint:
#         trajectory: 0.1
#         goal: 0.02
#       left_finger_link_joint:
#         trajectory: 0.2
#         goal: 0.05
#       right_finger_link_joint:
#         trajectory: 0.2
#         goal: 0.05
